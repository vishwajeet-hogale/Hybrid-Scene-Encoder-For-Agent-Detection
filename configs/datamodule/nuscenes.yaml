_target_: src.data.nuscenes_datamodule.NuScenesDataModule

data_root: nuscenes-mini
version: v1.0-mini         # change to v1.0-trainval later (and splits to train/val)
train_split: mini_train
val_split: mini_val
test_split: mini_val     # mini has no test split; use "test" with v1.0-test

batch_size: 8
num_workers: 4
pin_memory: false
persistent_workers: true     # avoid re-spawning workers (and re-pickling NuScenes) every epoch
shuffle: true
drop_last: true
use_camera: ${use_camera}
camera_cache: cache/dinov2_vits14
augment: true              # flip / rotate / scale on the train split only


# future knobs (we’ll use later)
bev:
  x_range: [-50.0, 50.0]
  y_range: [-50.0, 50.0]
  resolution: 0.5          # meters per cell

map:
  max_polylines: 256
  points_per_polyline: 20
