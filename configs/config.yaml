defaults:
  - _self_
  - datamodule: nuscenes

seed: 42
use_camera: false         # LiDAR-camera fusion (BEVFusion-style); run cache_camera_features.py first
init_ckpt: null           # path to a .ckpt to fine-tune from (weights only; fresh optimizer and LR schedule)

model:
  _target_: src.models.lit_perception_model.LitPerceptionModel

  pillar_cfg:
    x_range: [-10.0, 70.0]
    y_range: [-40.0, 40.0]
    z_range: [-5.0, 3.0]

    voxel_size: [0.5, 0.5]

    max_pillars: 3000          # max observed in mini is 2807 pillars; samples are padded to this (fixed GPU shapes)
    max_points_per_pillar: 24
  lr: 1e-3                 # peak LR of the one-cycle schedule
  weight_decay: 1e-2
  hm_weight: 1.0
  reg_weight: 0.25
  use_camera: ${use_camera}
  depth_weight: 0.5        # LiDAR-supervised depth loss of the camera branch
  pretrained_lr_scale: 1.0 # LR multiplier for non-camera parameters (e.g. 0.1 when fine-tuning fusion from LiDAR weights)
  # heading options (tried; no gain on mini_val, see walkthrough Step 12): 0.5 / 2.0 / 0.5 to enable
  reg_neighbor_weight: 0.0 # also supervise box regression at the 3x3 cells around each center (0 = center only)
  yaw_weight: 1.0          # loss weight of the sin/cos yaw channels relative to the other regression channels
  heading_weight: 0.0      # direct heading loss, 1 - cos(yaw error), at the supervised cells
  reg_loss: l1             # box regression loss: l1 or mse (mse squares errors: raise reg_weight to penalize more)
  loss_norm: false         # divide each loss by its running average and normalize the weights to sum to 1

trainer:
  _target_: lightning.pytorch.Trainer
  accelerator: mps
  devices: 1
  precision: 32
  max_epochs: 24
  log_every_n_steps: 10
  enable_checkpointing: true
  default_root_dir: outputs
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      monitor: val/mAP
      mode: max
      save_top_k: 1
      save_last: true
      filename: "best-epoch{epoch:02d}-mAP{val/mAP:.3f}"
      auto_insert_metric_name: false
    - _target_: lightning.pytorch.callbacks.LearningRateMonitor
      logging_interval: step
