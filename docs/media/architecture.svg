<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .t   { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .h   { font-size: 16px; font-weight: 700; fill: #1f2328; }
      .s   { font-size: 12.5px; fill: #57606a; }
      .d   { font-size: 12.5px; fill: #1f2328; font-weight: 600; }
      .lbl { font-size: 12px; fill: #57606a; font-style: italic; }
      .loss-t { font-size: 12.5px; fill: #a40e26; }
      .edge { stroke: #57606a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .lidar  { fill: #e8f0fe; stroke: #4a7bd0; stroke-width: 1.5; }
      .camera { fill: #fdf0e2; stroke: #e08a2c; stroke-width: 1.5; }
      .shared { fill: #eaf5ec; stroke: #4f9a5c; stroke-width: 1.5; }
      .group  { fill: #f6f8fa; stroke: #4f9a5c; stroke-width: 1.3; stroke-dasharray: 6,4; }
      .out    { fill: #f4f4f5; stroke: #8c959f; stroke-width: 1.5; }
      .loss   { fill: #fff5f5; stroke: #cf222e; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <text x="20" y="36" style="font-size: 21px; font-weight: 700; fill: #1f2328;">4DoF 3D Object Detection · LiDAR + camera fusion (BEVFusion-style)</text>
  <text x="20" y="60" class="s">Every bird's-eye-view (BEV) map uses one grid: x ∈ [−10, 70) m, y ∈ [−40, 40) m, 0.5 m cells → 160 × 160, in the ego frame</text>
  <rect class="lidar" x="905" y="72" width="14" height="12" rx="2"/><text x="925" y="82" class="s">LiDAR</text>
  <rect class="camera" x="975" y="72" width="14" height="12" rx="2"/><text x="995" y="82" class="s">camera</text>
  <rect class="shared" x="1055" y="72" width="14" height="12" rx="2"/><text x="1075" y="82" class="s">shared after fusion</text>

  <!-- ================= Tier 1: encoders + fuser ================= -->
  <!-- LiDAR branch -->
  <rect class="lidar" x="20" y="100" width="145" height="78" rx="8"/>
  <text x="92" y="130" class="t" text-anchor="middle">LiDAR sweep</text>
  <text x="92" y="150" class="s" text-anchor="middle">N × 4 (x, y, z, i)</text>
  <text x="92" y="167" class="s" text-anchor="middle">~34k points</text>

  <rect class="lidar" x="190" y="100" width="145" height="78" rx="8"/>
  <text x="262" y="126" class="t" text-anchor="middle">Pillarize (CPU)</text>
  <text x="262" y="146" class="s" text-anchor="middle">≤3000 pillars × 24 pts</text>
  <text x="262" y="164" class="s" text-anchor="middle">9-d point features</text>

  <rect class="lidar" x="360" y="100" width="145" height="78" rx="8"/>
  <text x="432" y="126" class="t" text-anchor="middle">Pillar Feature Net</text>
  <text x="432" y="146" class="s" text-anchor="middle">Linear · BN · ReLU</text>
  <text x="432" y="164" class="s" text-anchor="middle">max-pool → 64-d</text>

  <rect class="lidar" x="530" y="100" width="145" height="78" rx="8"/>
  <text x="602" y="126" class="t" text-anchor="middle">Scatter to BEV</text>
  <text x="602" y="146" class="s" text-anchor="middle">LiDAR BEV</text>
  <text x="602" y="165" class="d" text-anchor="middle">64 × 160 × 160</text>

  <path class="edge" d="M165,139 L188,139"/>
  <path class="edge" d="M335,139 L358,139"/>
  <path class="edge" d="M505,139 L528,139"/>

  <!-- Camera branch -->
  <rect class="camera" x="20" y="330" width="145" height="78" rx="8"/>
  <text x="92" y="360" class="t" text-anchor="middle">6 cameras</text>
  <text x="92" y="380" class="s" text-anchor="middle">1600 × 900 RGB</text>
  <text x="92" y="397" class="s" text-anchor="middle">360° coverage</text>

  <rect class="camera" x="190" y="330" width="145" height="78" rx="8"/>
  <text x="262" y="356" class="t" text-anchor="middle">DINOv2 ViT-S/14</text>
  <text x="262" y="376" class="s" text-anchor="middle">frozen · cached</text>
  <text x="262" y="394" class="s" text-anchor="middle">384 × 18 × 32 / cam</text>

  <rect class="camera" x="360" y="330" width="145" height="78" rx="8"/>
  <text x="432" y="356" class="t" text-anchor="middle">Depth net</text>
  <text x="432" y="376" class="s" text-anchor="middle">48 bins, 1–61 m</text>
  <text x="432" y="394" class="s" text-anchor="middle">+ sparse LiDAR depth</text>

  <rect class="camera" x="530" y="330" width="145" height="78" rx="8"/>
  <text x="602" y="356" class="t" text-anchor="middle">Lift + Splat</text>
  <text x="602" y="376" class="s" text-anchor="middle">Camera BEV</text>
  <text x="602" y="395" class="d" text-anchor="middle">32 × 160 × 160</text>

  <path class="edge" d="M165,369 L188,369"/>
  <path class="edge" d="M335,369 L358,369"/>
  <path class="edge" d="M505,369 L528,369"/>

  <!-- LiDAR -> camera depth guidance -->
  <path class="edge" d="M92,178 L92,252 L432,252 L432,328" stroke-dasharray="5,4"/>
  <text x="104" y="245" class="lbl">LiDAR points projected into each camera → depth input + depth supervision</text>

  <!-- Fuser (expanded) -->
  <rect class="group" x="715" y="160" width="545" height="210" rx="10"/>
  <text x="732" y="186" class="h">Fuser</text>
  <text x="732" y="394" class="s">fused = LiDAR BEV + Δ  ·  Δ = 0 at init → starts as the trained LiDAR-only model</text>

  <rect class="shared" x="750" y="240" width="95" height="60" rx="7"/>
  <text x="797" y="266" class="t" text-anchor="middle">concat</text>
  <text x="797" y="286" class="d" text-anchor="middle">96 × 160²</text>

  <rect class="shared" x="875" y="236" width="130" height="68" rx="7"/>
  <text x="940" y="259" class="t" text-anchor="middle">Conv 3×3</text>
  <text x="940" y="277" class="s" text-anchor="middle">BN · ReLU</text>
  <text x="940" y="294" class="d" text-anchor="middle">96 → 64</text>

  <rect class="shared" x="1035" y="236" width="125" height="68" rx="7"/>
  <text x="1097" y="259" class="t" text-anchor="middle">Conv 1×1</text>
  <text x="1097" y="277" class="s" text-anchor="middle">zero-init</text>
  <text x="1097" y="294" class="d" text-anchor="middle">64 → Δ</text>

  <circle cx="1210" cy="270" r="14" fill="#ffffff" stroke="#4f9a5c" stroke-width="1.8"/>
  <text x="1210" y="276" text-anchor="middle" style="font-size: 20px; font-weight: 700; fill: #4f9a5c;">+</text>

  <path class="edge" d="M845,270 L873,270"/>
  <path class="edge" d="M1005,270 L1033,270"/>
  <path class="edge" d="M1160,270 L1194,270"/>

  <!-- LiDAR into fuser: skip to (+) and into concat -->
  <path class="edge" d="M675,139 L1210,139 L1210,254"/>
  <path class="edge" d="M780,139 L780,238"/>
  <circle cx="780" cy="139" r="3.5" fill="#57606a"/>
  <text x="975" y="131" class="lbl">skip connection (identity)</text>
  <text x="690" y="131" class="lbl">64</text>
  <!-- camera into concat -->
  <path class="edge" d="M675,369 L815,369 L815,302"/>
  <text x="690" y="361" class="lbl">32</text>
  <text x="1223" y="314" class="d">64</text>

  <!-- ================= Tier 2: backbone, head, decode ================= -->
  <path class="edge" d="M1210,284 L1210,470 L100,470 L100,508"/>
  <text x="560" y="462" class="lbl">fused BEV · 64 × 160 × 160</text>

  <!-- Backbone (expanded) -->
  <rect class="group" x="20" y="510" width="680" height="270" rx="10"/>
  <text x="37" y="536" class="h">Multi-scale BEV backbone</text>

  <rect class="shared" x="45" y="555" width="185" height="52" rx="7"/>
  <text x="137" y="577" class="t" text-anchor="middle">Stage 1 · stride 1</text>
  <text x="137" y="597" class="s" text-anchor="middle">3 × Conv3×3 → 64 × 160²</text>
  <rect class="shared" x="45" y="626" width="185" height="52" rx="7"/>
  <text x="137" y="648" class="t" text-anchor="middle">Stage 2 · stride 2</text>
  <text x="137" y="668" class="s" text-anchor="middle">3 × Conv3×3 → 128 × 80²</text>
  <rect class="shared" x="45" y="697" width="185" height="52" rx="7"/>
  <text x="137" y="719" class="t" text-anchor="middle">Stage 3 · stride 4</text>
  <text x="137" y="739" class="s" text-anchor="middle">3 × Conv3×3 → 256 × 40²</text>
  <path class="edge" d="M137,607 L137,624"/>
  <path class="edge" d="M137,678 L137,695"/>

  <rect class="shared" x="265" y="561" width="175" height="40" rx="7"/>
  <text x="352" y="586" class="s" text-anchor="middle">1×1 (no resize) → 64 × 160²</text>
  <rect class="shared" x="265" y="632" width="175" height="40" rx="7"/>
  <text x="352" y="657" class="s" text-anchor="middle">Deconv ×2 → 64 × 160²</text>
  <rect class="shared" x="265" y="703" width="175" height="40" rx="7"/>
  <text x="352" y="728" class="s" text-anchor="middle">Deconv ×4 → 64 × 160²</text>
  <path class="edge" d="M230,581 L263,581"/>
  <path class="edge" d="M230,652 L263,652"/>
  <path class="edge" d="M230,723 L263,723"/>

  <rect class="shared" x="475" y="561" width="85" height="182" rx="7"/>
  <text x="517" y="644" class="t" text-anchor="middle">concat</text>
  <text x="517" y="664" class="d" text-anchor="middle">192 × 160²</text>
  <path class="edge" d="M440,581 L473,581"/>
  <path class="edge" d="M440,652 L473,652"/>
  <path class="edge" d="M440,723 L473,723"/>

  <rect class="shared" x="585" y="614" width="100" height="76" rx="7"/>
  <text x="635" y="638" class="t" text-anchor="middle">Conv 1×1</text>
  <text x="635" y="656" class="s" text-anchor="middle">BN · ReLU</text>
  <text x="635" y="675" class="d" text-anchor="middle">128 × 160²</text>
  <path class="edge" d="M560,652 L583,652"/>

  <!-- CenterHead (expanded) -->
  <rect class="group" x="720" y="510" width="285" height="270" rx="10"/>
  <text x="737" y="536" class="h">CenterHead</text>

  <rect class="shared" x="745" y="552" width="245" height="88" rx="7"/>
  <text x="867" y="574" class="t" text-anchor="middle">Heatmap branch</text>
  <text x="867" y="592" class="s" text-anchor="middle">Conv3×3 · BN · ReLU → Conv1×1</text>
  <text x="867" y="611" class="d" text-anchor="middle">3 × 160 × 160</text>
  <text x="867" y="629" class="s" text-anchor="middle">vehicle · pedestrian · cyclist</text>

  <rect class="shared" x="745" y="660" width="245" height="106" rx="7"/>
  <text x="867" y="682" class="t" text-anchor="middle">Regression branch</text>
  <text x="867" y="700" class="s" text-anchor="middle">Conv3×3 · BN · ReLU → Conv1×1</text>
  <text x="867" y="719" class="d" text-anchor="middle">8 × 160 × 160</text>
  <text x="867" y="737" class="s" text-anchor="middle">dx, dy · z · log w, l, h</text>
  <text x="867" y="754" class="s" text-anchor="middle">sin yaw, cos yaw</text>

  <path class="line" d="M685,652 L728,652"/>
  <path class="line" d="M728,596 L728,713"/>
  <path class="edge" d="M728,596 L743,596"/>
  <path class="edge" d="M728,713 L743,713"/>

  <!-- Decode -->
  <rect class="out" x="1030" y="552" width="230" height="214" rx="8"/>
  <text x="1145" y="578" class="t" text-anchor="middle">Decode</text>
  <text x="1145" y="602" class="s" text-anchor="middle">peaks (3×3 max-pool)</text>
  <text x="1145" y="621" class="s" text-anchor="middle">top-K → score threshold</text>
  <text x="1145" y="640" class="s" text-anchor="middle">read 8 values at each peak</text>
  <text x="1145" y="659" class="s" text-anchor="middle">circle NMS</text>
  <text x="1145" y="690" class="d" text-anchor="middle">3D box per agent</text>
  <text x="1145" y="709" class="s" text-anchor="middle">(x, y, z, w, l, h, yaw)</text>
  <text x="1145" y="733" class="s" text-anchor="middle">4-DoF pose + 3D size</text>
  <text x="1145" y="751" class="s" text-anchor="middle">ego frame</text>
  <path class="edge" d="M990,596 L1028,596"/>
  <path class="edge" d="M990,713 L1008,713 L1008,640 L1028,640"/>

  <!-- ================= Losses ================= -->
  <text x="20" y="820" class="h">Training losses</text>
  <rect class="loss" x="20" y="834" width="400" height="44" rx="8"/>
  <text x="220" y="853" class="loss-t" text-anchor="middle">heatmap: CenterNet focal loss</text>
  <text x="220" y="870" class="loss-t" text-anchor="middle">target 1 at object centers, Gaussian falloff around them</text>
  <rect class="loss" x="440" y="834" width="400" height="44" rx="8"/>
  <text x="640" y="853" class="loss-t" text-anchor="middle">box: L1 on the 8 regression values</text>
  <text x="640" y="870" class="loss-t" text-anchor="middle">only at each object's center cell (weight 0.25)</text>
  <rect class="loss" x="860" y="834" width="400" height="44" rx="8"/>
  <text x="1060" y="853" class="loss-t" text-anchor="middle">camera depth: cross-entropy (weight 0.5)</text>
  <text x="1060" y="870" class="loss-t" text-anchor="middle">against LiDAR depth bins, in cells that have LiDAR points</text>
</svg>
